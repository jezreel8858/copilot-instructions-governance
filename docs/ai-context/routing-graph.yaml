version: "1.0"
description: >
  Grafo de roteamento declarado — fonte de verdade estrutural para o agent-router.
  Nós = agents disponíveis; arestas = condições de roteamento (keywords, sinais R-006, score threshold).
  A Decision Tree em agent-router.agent.md é documentação derivada deste arquivo.
last_updated: "2026-08-29 (code-review: nó + aresta adicionados)"

# ─────────────────────────────────────────────
# NÓS — agents disponíveis no catálogo
# ─────────────────────────────────────────────
nos:
  - id: agent-router
    tipo: entry_point
    descricao: "Entry point obrigatório — nunca é destino, apenas origem"

  - id: prompt-structuring
    tipo: mandatory_pre_step
    descricao: >
      Passo mandatório pós-health-check (R-041): refina o prompt em loop
      controlado (máx. 5 iterações) no formato <task>/<context>/<constraints>/
      <output_format> e SEMPRE retorna ao agent-router. Nunca é destino final.

  - id: bug-triage
    tipo: downstream
    descricao: "Triagem de bugs e regressões"

  - id: test-strategy
    tipo: downstream
    descricao: "Planejamento e estratégia de testes"

  - id: test-implementation
    tipo: downstream
    descricao: "Implementação de suítes de teste"

  - id: test-fix
    tipo: downstream
    descricao: "Correção de testes quebrados com relatório de falhas"

  - id: business-rules-extractor
    tipo: downstream
    descricao: "Extração e validação de regras de negócio"

  - id: refactor-planner
    tipo: downstream
    descricao: "Planejamento de refatoração segura"

  - id: impact-architect
    tipo: downstream
    descricao: "Análise de impacto técnico local"

  - id: docs-curator
    tipo: downstream
    descricao: "Curadoria e atualização de documentação de governança"

  - id: docs-writer
    tipo: downstream
    descricao: "Geração/escrita de documentação técnica nova em Markdown, agnóstica de domínio (perfil documentador) — produz exclusivamente arquivos .md"

  - id: code-review
    tipo: downstream
    descricao: "Revisão de código (diff/PR) antes do merge — correção, segurança, convenções, impacto, testes e performance; classifica por severidade; read-only, nunca corrige"

  - id: research-router
    tipo: fallback
    descricao: "Triagem de pesquisa externa — fallback primário"

  - id: analysis-architect
    tipo: fallback
    descricao: "Análise técnica cross-projeto e integrações cross-sistema (v2.0.0 — unificado com analysis-integration-architect)"

  - id: agent-factory
    tipo: downstream
    descricao: "Criação e revisão de agents customizados"

  - id: skill-factory
    tipo: downstream
    descricao: "Criação e revisão de skills"

  - id: binding-initializer
    tipo: health_check
    descricao: "Inicialização de binding context — acionado antes da triagem se catalog.yaml ausente"

  - id: adapter-generator
    tipo: downstream
    descricao: "Geração automática de adapters via /add-project-context"

  - id: context-builder
    tipo: downstream
    descricao: "Coleta e consolidação de contexto técnico"

# ─────────────────────────────────────────────
# ARESTAS — condições de roteamento
# Cada aresta define: origem, destino, sinais de ativação e threshold mínimo
# ─────────────────────────────────────────────
arestas:
  # Health check obrigatório (pré-triagem)
  - de: agent-router
    para: binding-initializer
    prioridade: 0
    threshold_score: 0  # null — health check não usa score numérico
    nivel_routing: rule-based
    condicoes:
      tipo: health_check
      regra: "R-034"
      gatilho: "docs/ai-context/catalog.yaml ausente OU docs/ai-context/binding.md ausente"

  # Prompt structuring obrigatório (pré-classificação) — exceção R-041
  - de: agent-router
    para: prompt-structuring
    prioridade: 0.5
    threshold_score: 0  # null — passo mandatório, não usa score numérico
    nivel_routing: rule-based
    condicoes:
      tipo: mandatory_pre_step
      regra: "R-041"
      gatilho: "Sempre, após Health Check (R-034) e antes de qualquer classificação de intenção — exceto quando a solicitação já retornou refinada por prompt-structuring"
      loop_maximo: 5
      retorno_obrigatorio: agent-router

  # Bug / Erro / Regressão
  - de: agent-router
    para: bug-triage
    prioridade: 1
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "bug"
        - "erro"
        - "regressão"
        - "falha em produção"
        - "não funciona"
        - "exception"
        - "NPE"
        - "500"
        - "stack trace"
      sinal_r006: "É bug/erro/regressão?"

  # Revisão de código antes do merge
  - de: agent-router
    para: code-review
    prioridade: 1.5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisar código"
        - "code review"
        - "revisão antes do merge"
        - "analisar pull request"
        - "revisar diff"
        - "revisar pr"
      sinal_r006: "É revisão preventiva de qualidade ANTES do merge (não bug já ocorrido)?"
      nao_confundir_com:
        - "bug em produção"        # → bug-triage (algo já quebrou)
        - "impacto de mudar X"     # → impact-architect (análise isolada de impacto)

  # Estratégia de testes
  - de: agent-router
    para: test-strategy
    prioridade: 2
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "estratégia de testes"
        - "planejar testes"
        - "cobertura"
        - "cenários de teste"
        - "matriz de testes"
      sinal_r006: "É estratégia/plano de testes?"
      nao_confundir_com:
        - "implementar testes"  # → test-implementation
        - "corrigir testes"     # → test-fix

  # Implementação de testes
  - de: agent-router
    para: test-implementation
    prioridade: 2
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "implementar testes"
        - "criar testes"
        - "escrever testes"
        - "adicionar cobertura"
        - "junit"
        - "jasmine"
        - "vitest"
        - "pytest"

  # Correção de testes quebrados
  - de: agent-router
    para: test-fix
    prioridade: 2
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "testes quebrados"
        - "testes falhando"
        - "broken test"
        - "corrigir teste"
        - "test failure"
        - "flaky test"
      requisito: "relatório de falhas presente (ou ask_questions para obtê-lo)"

  # Extração de regras de negócio
  - de: agent-router
    para: business-rules-extractor
    prioridade: 3
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "regra de negócio"
        - "extrair regra"
        - "documentar comportamento"
        - "validar refatoração"
        - "ground truth"

  # Refatoração
  - de: agent-router
    para: refactor-planner
    prioridade: 3
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "refatorar"
        - "refactor"
        - "clean code"
        - "simplificar código"
        - "eliminar duplicação"
        - "reestruturar"

  # Análise de impacto
  - de: agent-router
    para: impact-architect
    prioridade: 4
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "impacto"
        - "risco"
        - "dependências"
        - "o que muda"
        - "quem é afetado"
        - "breaking change"

  # Documentação
  - de: agent-router
    para: docs-curator
    prioridade: 5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "atualizar documentação"
        - "curar doc"
        - "README"
        - "catálogo"
        - "rastreabilidade de doc"
      nao_confundir_com:
        - "escrever documentação nova"  # → docs-writer
        - "criar documentação técnica"  # → docs-writer

  # Documentação — escrita/geração de conteúdo novo
  - de: agent-router
    para: docs-writer
    prioridade: 5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "escrever documentação"
        - "criar documentação técnica"
        - "gerar readme"
        - "criar adr"
        - "documentar decisão técnica"
        - "gerar arquivo md"
        - "documentador"
        - "runbook"
        - "postmortem"
      sinal_r006: "É criação de documentação NOVA (não curadoria de doc já existente)?"
      nao_confundir_com:
        - "atualizar documentação existente"  # → docs-curator
        - "curar catálogo"                    # → docs-curator

  # Agent factory
  - de: agent-router
    para: agent-factory
    prioridade: 6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "criar agent"
        - "novo agent"
        - "revisar agent"
        - "padronizar agent"

  # Skill factory
  - de: agent-router
    para: skill-factory
    prioridade: 6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "criar skill"
        - "nova skill"
        - "revisar skill"

  # Análise de integração cross-sistema + análise técnica geral (unificado em analysis-architect v2.0.0)
  - de: agent-router
    para: analysis-architect
    prioridade: 7
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "integração entre sistemas"
        - "contrato de API"
        - "breaking change de contrato"
        - "openapi"
        - "asyncapi"
        - "grpc"
        - "blast radius"
        - "fluxo de dados cross-sistema"
        - "acoplamento entre serviços"

  # Pesquisa externa — fallback primário
  - de: agent-router
    para: research-router
    prioridade: 8
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Dúvida técnica, pesquisa externa, benchmark de mercado"
      gatilho: "Intenção clara mas requer informação externa ao repositório"

  # Análise técnica genérica e cross-projeto — fallback secundário amplo
  - de: agent-router
    para: analysis-architect
    prioridade: 9
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Análise técnica genérica, impacto, requisitos, fluxos ou qualquer análise cross-sistema"
      gatilho: "Escopo que envolve análise de impacto, contratos, dependências ou integrações"

# ─────────────────────────────────────────────
# POLÍTICA DE CASCATA
# Aplicada quando score < threshold da aresta rule-based
# ─────────────────────────────────────────────
politica_cascata:
  nivel_1_rule_based:
    threshold: 0.90
    acao: "Rotear diretamente pela aresta com mais keywords correspondentes"

  nivel_2_semantic:
    threshold: 0.70
    acao: "Calcular similaridade semântica entre solicitação e descrição dos agents"

  nivel_3_llm_based:
    threshold: 0.50
    acao: "LLM tiebreaker — solicitar ao modelo atual a decisão de roteamento com contexto"

  escalonamento_humano:
    threshold: 0.00
    acao: "ask_questions com top-3 candidatos como opções"

  ambiguity_zone:
    descricao: "Top-1 e Top-2 scores dentro de 0.05 um do outro"
    acao: "Aplicar nível 3 (LLM tiebreaker) independentemente do threshold absoluto"

