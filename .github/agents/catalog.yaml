    priority: 4.95
    version: "2.1.0"
    domain: "Grafo de conhecimento de codigo cross-projeto (nivel codigo + nivel arquitetural, puramente deterministico, motor Semgrep)"
    description: >-
      Ponto de entrada unico para construcao e consulta do grafo de conhecimento
      de codigo-fonte (RF-001/RF-002/RF-011 do REQ de grafo de conhecimento):
      motor de extracao unico e consolidado e o Semgrep CLI (RF-021), invocado
      via subprocess em venv isolado, substituindo integralmente o regex
      artesanal original e a lib dependency-cruiser (avaliada e rejeitada apos
      POC real). Constroi nos (arquivo/classe/funcao) e arestas (import/chamada/
      heranca/uso de tabela-coluna SQL) cross-projeto via docs/ai-context/catalog.yaml,
      tudo por via puramente deterministica (RNF-008). Desde a extensao RF-013..RF-019
      (REQ §8.3), cobre tambem o nivel arquitetural: coleta de artefatos de integracao
      (HTTP clients, service discovery), nos system/service, arestas http/queue/event,
      blast radius (profundidade 1 e 2), deteccao de dependencia circular, classificacao
      de acoplamento (coupling: tight/loose/eventual/circular) e de risco (por contagem
      de dependentes + sensibilidade PII/financeiro), e diagrama Mermaid (RF-019) —
      todas puramente deterministicas (RNF-011). Matching cross-repo 1-para-N (RF-021)
      com guarda de profundidade minima de path, corrigindo falso-positivo em massa
      encontrado com paths curtos/genericos. Validado em 4 rodadas reais: single-project
      (9/9 gate), multi-framework Angular+Spring Boot, cross-repo em escala (2213
      arquivos reais, 849 nos, 28 arestas cross-repo, 0 falso-positivo, 3 ciclos reais
      detectados). RF-012/RNF-009 (remocao efetiva da skill legada dependency-graph-mapping)
      foram EXECUTADOS (§11..§14 do REQ). Cobertura de framework (RF-022, ~40 regras)
      inclui Angular (@NgModule/@Directive/@Pipe/inject/Signals), Spring Boot
      (@Controller/@Repository/@Entity/@Configuration/@Bean/@Transactional, idioma
      Spring Data), Spring Reactive/WebFlux (Mono/Flux/WebClient/RouterFunction/
      R2dbcRepository) e EJB/Jakarta EE (@Stateless/@Stateful/@Singleton/
      @MessageDriven/@EJB/@Local/@Remote/@Schedule/@Timeout/@TransactionAttribute) —
      validadas com evidencia real (exceto EJB, sem projeto real no workspace,
      apenas teste sintetico). Nunca deve ser substituido por chamada
      direta a lib de parsing/grafo por outros agents (RNF-004).

metadata:
  total_agents: 26
  last_updated: "2026-09-01T17:00:00Z"
  changelog: "2026-09-01 (18) — Cobertura de framework (RF-022, novo) internalizada no code-knowledge-graph (v2.0.0 -> v2.1.0), a pedido do usuario ('pesquise na web por rules consolidados... angular, spring boot, spring reactive e EJB'). Pesquisa @deep-search (clone real de github.com/semgrep/semgrep-rules) confirmou que o registry oficial cobre so seguranca (XSS/SQLi/SSRF), sem patterns estruturais de framework/arquitetura para nenhum dos 4 alvos — todas as ~20 novas regras foram propostas e validadas do zero. Adicionadas a semgrep-rules.yaml: Angular complementar (@NgModule/@Directive/@Pipe/inject()/Signals — validado real em angular-example: 24/27/22/605/519 matches), Spring Boot complementar (@Controller/@Repository/@Entity/@Configuration/@Bean/@Transactional — validado real em springboot-api-web+springboot-api-web: 42/50/11/10/47 matches; @Controller puro sem evidencia real), Spring Reactive/WebFlux (Mono/Flux/WebClient/RouterFunction/R2dbcRepository — validado real em webflux-patterns+spring-mvc-vs-webflux: 73/12/28 matches; RouterFunction/R2dbcRepository sem evidencia real), EJB/Jakarta EE (Stateless/Stateful/Singleton/MessageDriven/EJB/Local/Remote/Schedule/Timeout/TransactionAttribute — SEM projeto real no workspace, validado apenas contra arquivo sintetico de teste). Bug real encontrado e corrigido: @Repository do Spring Data e tipicamente aplicado a interface (extends JpaRepository), nao class (mesma classe de limitacao do Semgrep AST ja documentada para RF-018 item 8) — regra corrigida com pattern-either cobrindo os 3 idiomas reais. code-knowledge-graph.agent.md atualizado com nova secao 'Cobertura de Framework (RF-022)'. Registrado atomicamente (catalog.yaml, este); total_agents permanece 26. | 2026-09-01 (17) — Consolidacao do motor de extracao do agent code-knowledge-graph (v1.2.0 -> v2.0.0) em Semgrep CLI (unico, RF-021/RNF-013), a pedido explicito do usuario apos rejeitar dependency-cruiser ('a lib que voce elencou foi horrivel'). Removidos integralmente os arquivos legados em snippets/code-knowledge-graph/: build-graph.js (regex artesanal original), poc-dependency-cruiser.js, poc-semgrep-rules.yaml, poc-semgrep-rules-cross-repo.yaml, build-cross-repo-graph.py (script POC intermediario) — substituidos por 2 arquivos consolidados: semgrep-rules.yaml (16 regras: import graph TS/Java, framework Angular/Spring, integracao HTTP/evento, sensibilidade de dado via pattern-regex nativo do Semgrep, endpoints REST cross-repo) e build-graph.py (orquestrador unico via subprocess, BFS/DFS/matching 1-para-N em Map/Set). Pesquisa web confirmou que Semgrep OSS/CE nao tem 'join mode' estavel para matching 1-para-N nativo (responsabilidade de pos-processamento). 2 bugs reais encontrados e corrigidos durante consolidacao: (1) Semgrep AST nao reconhece 'interface' TS para pattern de field (so 'class') — corrigido com pattern-regex nativo (funciona para ambos); (2) matching cross-repo 1-para-1 greedy gerava falso-positivo em massa com paths curtos (ex. '/v1' sozinho casava com 39 controllers) — corrigido com guarda de profundidade minima de 2 segmentos de path. Validado em escala real: springboot-api-web (Spring Boot, 1163 arquivos) + angular-example (Angular, 1050 arquivos) = 2213 arquivos, ~4min, 849 nos, 1047 arestas (1017 import, 68 http), 3 ciclos reais detectados, 28 arestas cross-repo (21 exact + 7 heuristic, 0 falso-positivo pos-fix). Agent registrado atomicamente (README.md, este catalog.yaml); nenhuma mudanca em total_agents (26). Documentado em docs/requirements/REQ-grafo-conhecimento-codigo.md §15..§17. | 2026-09-01 (16) — Executado plano de remocao autorizado (docs/requirements/REQ-grafo-conhecimento-codigo.md §13.4, rodada 14): removida a skill dependency-graph-mapping do repositorio apos Gate de Paridade Funcional (RNF-012) validado 9/9 com evidencia de execucao real (§11/§12 do REQ). Atualizados atomicamente: code-knowledge-graph.agent.md (v1.1.0->v1.2.0, ~9 referencias 'nao remover'/'permanece intacta' removidas, RF-017/RF-018/RF-019 agora fonte normativa propria), analysis-architect.agent.md (referencia a dependency-graph-mapping substituida por @code-knowledge-graph), refactor-planner.agent.md (idem), catalog.yaml (related_skills/source_docs/description atualizados nos 3 agents), skills/.index.json (entrada removida), skills/README.md (linha de catalogo removida) e o proprio arquivo .github/skills/dependency-graph-mapping/SKILL.md (removido fisicamente). Nenhuma referencia orfa remanescente em .github/ apos varredura final (R-015/R-040). | 2026-09-01 (15) — Estendido agent code-knowledge-graph (v1.0.0 -> v1.1.0) implementando RF-013..RF-019/RNF-011/RNF-012 (docs/requirements/REQ-grafo-conhecimento-codigo.md §8.3, plano tecnico do analysis-architect rodada 6): agora cobre tambem o nivel arquitetural entre sistemas/servicos — coleta de artefatos de integracao via grep_search/file_search (RF-013), construcao real de nos type:system|service e arestas type:http|queue|event antes apenas reservados no schema (RF-014), blast radius profundidade 1 e 2 via BFS limitado sobre a estrutura Map/Set ja existente sem lib externa (RF-015), deteccao de dependencia circular via DFS com pilha de recursao (RF-016), novo campo Edge.coupling (tight|loose|eventual|circular) com regra deterministica por type — explicitamente distinto de confidence (RF-017), classificacao de risco por contagem real de dependentes diretos + flag de sensibilidade PII/financeiro replicando a tabela de dependency-graph-mapping/SKILL.md (RF-018), e geracao de diagrama Mermaid para grafos com 3+ nos referenciando mermaid-diagrams/SKILL.md e reaproveitando as convencoes de cor de dependency-graph-mapping/SKILL.md sem duplicar nenhuma das duas skills (RF-019). Todas as extensoes permanecem puramente deterministicas, sem excecao (RNF-011, reforca RNF-008). Nova secao 'Gate de Paridade Funcional' (RNF-012) no Formato de Saida e Checklist, com os 9 itens do checklist REQ §8.1 marcaveis individualmente — pre-requisito objetivo antes de qualquer autorizacao futura de RF-012 (remocao da skill dependency-graph-mapping), que permanece fora de escopo deste agent e bloqueada ate @analysis-architect validar o gate 100% em nova rodada. Footprint de RF-012 (6 arquivos, incluindo dependency-graph-mapping/SKILL.md) permanece intocado nesta rodada. Nota de rastreabilidade adicionada ao REQ (§9), sem alterar o veredito de RF-012/RNF-009. Registrado atomicamente em catalog.yaml e README.md (R-015); total_agents permanece 26. | 2026-09-01 (14) — Criado agent code-knowledge-graph (perfil Operacional/Executor, puramente deterministico) implementando o MVP de nivel codigo (RF-001..RF-011) do REQ docs/requirements/REQ-grafo-conhecimento-codigo.md: ponto de entrada unico para construcao/consulta de grafo de conhecimento de codigo-fonte cross-projeto (RF-003), 3 granularidades de no (arquivo/classe/funcao, RF-004) e 4 tipos de aresta (import/chamada/heranca/sql-table, RF-005), reaproveitando a extracao AST ja produzida pelo code-summarizer via cache compartilhado ast-extract:* (RF-011/RNF-001/§6.3), com camada de cache propria code-graph:* para o grafo agregado; resolucao cross-repo por heuristica de nome de simbolo com flag confidence exact|heuristic, arestas heuristic nunca contam para o calculo de cobertura >=80% (RF-010/RNF-005/§6.2); estrutura de grafo interna via Map/Set em memoria, sem lib externa, tratada como tool interna nunca exposta (RNF-004/§6.5); execucao puramente deterministica, sem invocar LLM em nenhuma etapa (RNF-008 — diferenca arquitetural explicita do code-summarizer, que e hibrido); persistencia exclusiva em cache do context-mode nesta fase, sem arquivo .json/.md versionado (RF-008); respeita R-009 (nunca persiste sem confirmacao no gatilho pos-/add-project-context), R-010 (nunca reproduz segredo) e R-038 (artefato generico). Limitacao conhecida documentada: RNF-006/RNF-007 (limiares de performance/latencia) permanecem NAO IDENTIFICADO no REQ, sem SLA garantido. RF-012/RNF-009 (remocao da skill dependency-graph-mapping) permanecem FORA DE ESCOPO desta criacao, bloqueados ate pesquisa de mercado + validacao de paridade funcional por @analysis-architect — nenhuma referencia a dependency-graph-mapping foi alterada. run_subagent presente no frontmatter (bloqueante R-042); secao Retorno ao Router com gatilho de deriva especifico. Registrado atomicamente em catalog.yaml e README.md (R-015); total_agents 25 -> 26."
