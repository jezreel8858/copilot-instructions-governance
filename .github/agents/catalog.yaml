  changelog: "2026-09-01 (23) — Usuario reportou que MESMO com agent-router em Claude Sonnet 5 (rodada 22), o Model Gate ainda nao disparou. Pesquisa web confirmou INVIABILIDADE TECNICA da abordagem (nao era problema de tier/instrucao): (a) LLMs nao tem acesso confiavel a 'qual modelo esta realmente me executando agora' — GitHub Community Discussion #168899 documenta usuario tentando forcar essa informacao do Copilot, que 'recusou-se a responder, alegou que era segredo... disse que estava alem do seu conhecimento'; (b) artigos tecnicos confirmam que identidade de modelo em LLMs so existe se injetada explicitamente no system prompt pela plataforma — o que VS Code Copilot Chat nao faz para custom agents; (c) nao existe tool/API publica que exponha o modelo real de execucao a um custom agent; (d) ask_questions nao tem poder de alterar o picker de modelo da UI (troca real exige clique manual); (e) confirmado via microsoft/vscode#298380 ('Allow runSubagent tool to specify a language model') que o proprio canal de parametro explicito de modelo no runSubagent e uma FEATURE REQUEST AINDA ABERTA — nem a resolucao de prioridade 1 documentada e uma API estruturada garantida, funciona apenas via seguimento de linguagem natural (melhor esforco). Decisao: Model Gate REMOVIDO de agent-router.agent.md (v1.7.0 -> v1.8.0) — logica de comparacao/bloqueio via ask_questions eliminada, substituida por 'Model Awareness' (secao renomeada): (1) menção do modelo do agent-alvo na propria frase de invocacao do run_subagent (canal 'explicit model parameter' documentado, melhor esforco, nao garantido); (2) responsabilidade explicitamente transferida para o USUARIO via documentacao (nao pode ser verificada/enforcada pelo agent) — selecionar manualmente tier >= Claude Sonnet 5 antes do 1o turno, nunca Auto. Nota importante: esta descoberta tambem implica que o R-036 Health Check ORIGINAL (comparar Expected vs Current model para invocacao direta) tem a MESMA limitacao estrutural — nunca foi verificavel de fato, apenas documentado como boa pratica; R-036 permanece como diretriz honesta (nao enforcavel automaticamente) apos esta correcao. Mantido: upgrade de agent-router para Claude Sonnet 5 (beneficio real e independente — melhor fidelidade de instruction-following nos demais passos R-034/R-041/R-042, confirmado por observacao empirica antes da descoberta da inviabilidade do Gate). Atualizado: agent-router.agent.md (secao Model Gate -> Model Awareness, CRITICO, Decision Tree, Formato de Saida, Checklist, Diretrizes, Anti-padroes), catalog.yaml (este), CLAUDE.md (R-036), copilot-instructions.md, agent-contracts/SKILL.md §10 (nota de inviabilidade tecnica com fontes). total_agents permanece 35. | 2026-09-01 (22) — Usuario reportou via 2 prints de teste real que o Model Gate (rodada 21) NAO disparou: agent-router (Claude Haiku 4.5) foi direto de Health Check/Triagem de Intencao para 'Roteando para security-reviewer' sem nunca imprimir a linha [Model Gate], mesmo apos reforco do PASSO 1 obrigatorio e reposicionamento no topo do bloco CRITICO. Diagnostico: 2 causas raiz. (a) Decision Tree prosa nunca tinha sido atualizada com branches para os 9 agents da rodada 20 (security-reviewer, performance-agent, compliance-guardrails, feature-planner, agentic-memory-manager, devops-engineer, debugger, code-style-enforcer, refactor-executor) — router estava roteando por inferencia propria, ignorando a arvore e por consequencia ignorando o Gate junto (corrigido: todos os 9 branches adicionados). (b) Mesmo apos corrigir (a) e reforcar o Gate como PASSO 1 numerado + linha 'sempre impressa' no Formato de Saida + primeiro item do bloco CRITICO, o router (Haiku 4.5) AINDA nao executou a logica condicional em novo teste do usuario — evidencia empirica de que Haiku 4.5 tem confiabilidade insuficiente para seguir corretamente instrucoes condicionais complexas em arquivo de ~370 linhas com multiplos passos obrigatorios concorrentes (R-034 health check, R-041 prompt-structuring loop, R-042 re-triagem, R-036 model gate). Decisao: elevar o proprio tier do agent-router de Claude Haiku 4.5 para Claude Sonnet 5 (v1.6.0 -> v1.7.0) — modelos maiores tem fidelidade comprovadamente maior em instruction-following de multi-step conditionals; efeito colateral positivo: como todo o catalogo atual (35 agents) e Haiku ou Sonnet (nenhum Opus-tier), o proprio agent-router rodando em Sonnet 5 elimina estruturalmente o risco de cost-tier ceiling da plataforma para qualquer delegacao atual (Sonnet >= tier de todos os downstream), tornando o Model Gate hoje quase sempre ✅ OK — o Gate permanece implementado para quando agents Opus-tier forem adicionados no futuro. Trade-off assumido e documentado: custo por turno sobe de 0x/Haiku para 1x/Sonnet em TODA invocacao do router (R-037/R-042 executam a cada turno), decisao justificada por confiabilidade > custo marginal para um agent de entry-point obrigatorio. Atualizado: agent-router.agent.md (frontmatter model + description + 3 referencias internas ao proprio tier no corpo do Model Gate/checklist), catalog.yaml (este, campo model do agent-router). total_agents permanece 35 (nenhum agent novo, apenas upgrade de tier + correcao de Decision Tree). | 2026-09-01 (21) — A pedido do usuario ('e possivel no fluxo de roteamento termos uma trava validando o modelo atual para o modelo a qual sera roteado solicitando por ask_question que o usuario altere o modelo para o correto?'), implementado Model Gate em agent-router.agent.md (v1.5.0 -> v1.6.0): nova secao 'Model Gate — Trava Ativa de Modelo' com procedimento bloqueante executado apos decidir a rota e ANTES de chamar run_subagent — compara o tier do modelo da sessao atual contra o tier declarado para o agent-alvo (campo model: deste catalog.yaml); se o alvo exigir tier superior, aciona ask_questions com 3 opcoes (A: trocar modelo e prosseguir | B: continuar com QoS reduzida | C: cancelar roteamento), bloqueando a delegacao ate resolucao. Pre-requisito de dados: adicionado campo `model:` a TODAS as 35 entradas deste catalog.yaml (fonte rapida de lookup do Gate, sem precisar ler cada .agent.md inteiro a cada roteamento) — valores extraidos do frontmatter real de cada .agent.md via grep. Gap pre-existente fechado nesta rodada: agent docs-curator.agent.md existia fisicamente desde antes mas NUNCA teve entrada neste catalog.yaml (falha de registro anterior a esta sessao) — entrada minima criada agora com model: 'Claude Haiku 4.5', domain, description, keywords, related_agents/skills e source_docs, seguindo o padrao dos demais 34 agents. total_agents permanece 35 (nenhum agent novo, apenas gap de catalogacao fechado). Documentacao complementar: Formato de Saida do agent-router ganhou campo 'Model Gate: <status>' para auditoria; Checklist Antes de Rotear e Anti-padroes atualizados com item obrigatorio do Gate. Nota tecnica: durante esta sessao foi observada divergencia transitoria entre o buffer do editor (read_file, correto) e uma leitura anterior via terminal/git diff do mesmo arquivo agent-router.agent.md (acentuacao ausente, model: alterado para lista nao intencional) — resolvido via reescrita completa do arquivo com o conteudo correto confirmado por dupla leitura (read_file + grep no disco pos-escrita); nenhum dado real foi perdido, mas o incidente foi registrado aqui para rastreabilidade (R-016). | 2026-09-01 (20) — @agent-router revisou o levantamento de gaps de perfil de agents feito em rodada anterior (analise consolidada de mercado: Anthropic/OpenAI/Microsoft/Google/GitHub/SpecWeave/ArXiv), corrigindo 2 imprecisoes antes de agir: (a) 'Integration Contract Analysis' NAO era gap real — skill integration-contract-analysis ja existe e ja e usada por analysis-architect (falso-positivo removido); (b) Security/Performance nao eram '0% cobertura' — code-review-patterns ja cobria como dimensao generica, gap real era ausencia de agent especialista dedicado (nuance corrigida). Apos validacao, criados via pesquisa web (Tavily: OWASP Top 10:2025/ASVS 5.0/Agentic AI Security 2026, Core Web Vitals/N+1 2026, SOC 2/GDPR/LGPD 2026, task decomposition 2026) 5 skills novas (security-review-patterns, performance-engineering-patterns, compliance-governance-patterns, task-decomposition-patterns, devops-agent-patterns) e 9 agents novos: security-reviewer (P1 critico), performance-agent (P1 critico), compliance-guardrails (P1 critico, distinto de agent-safety-guardrails que cobre seguranca do proprio agent de IA), feature-planner (P2, distinto de refactor-planner), agentic-memory-manager (P2, reaproveitando skill existente agent-memory-policy sem duplicacao R-003), devops-engineer (P3), debugger (P3, reaproveitando skill existente code-tracing sem duplicacao R-003), code-style-enforcer (P3), refactor-executor (P3). Todos os 9 agents seguem o padrao estrutural do projeto (frontmatter completo, Decision Tree, Formato de Saida, Retorno ao Router R-042, Banner de Identidade). Registrado atomicamente em catalog.yaml (este), README.md, skills/.index.json, skills/README.md (R-015). total_agents 26->35, total_skills 47->52. | 2026-09-01 (19) — A pedido do usuario ('os agents agent-factory e prompt-factory devem: 1- escolher adequadamente o modelo... 2- validar quais modelos existem disponiveis no copilot da ide'), adicionado protocolo de Selecao e Validacao de Modelo como nova secao 9 em governance-factory-patterns/SKILL.md (skill compartilhada, evita duplicacao R-003 entre os 2 agents): 9.1 classificacao de perfil (Haiku/Sonnet/Opus por criterios objetivos de R-021), 9.2 protocolo de validacao real via get_errors (escrever candidato em Title Case oficial -> rodar get_errors -> se 'Unknown model' tentar proximo candidato do mesmo tier -> se 2 falharem, perguntar ao usuario via ask_questions como ultimo recurso), 9.3 nota sobre falta de paridade garantida entre VS Code e JetBrains (get_errors reflete o ambiente real, tabela oficial pode estar desatualizada), 9.4 anti-padroes (array nao suportado, kebab-case nao reconhecido, nunca escalar tier sem necessidade). agent-factory.agent.md e prompt-factory.agent.md atualizados: novo passo na Decision Tree, novo item nos Padroes Obrigatorios/Checklist/Formato de Saida/Anti-padroes referenciando a nova secao 9; agent-factory ganhou ask_questions no tooling (faltava, bloqueava o passo 5 do protocolo); prompt-factory teve um bug real de documentacao corrigido (afirmava que array ['a','b'] era aceito em model: — falso, sempre gera Unknown model, confirmado empiricamente em turno anterior). R-001..R-0XX desatualizado (R-029/R-040) corrigido para R-001..R-043 em ambos os agents. catalog.yaml (este) atualizado nas 2 entries (description + prerequisite_docs/related_skills incluindo governance-factory-patterns, que faltava ser listada apesar de ja ser dependencia funcional real). total_agents permanece 26 (nenhum agent novo). | 2026-09-01 (18) — Cobertura de framework (RF-022, novo) internalizada no code-knowledge-graph (v2.0.0 -> v2.1.0), a pedido do usuario ('pesquise na web por rules consolidados... angular, spring boot, spring reactive e EJB'). Pesquisa @deep-search (clone real de github.com/semgrep/semgrep-rules) confirmou que o registry oficial cobre so seguranca (XSS/SQLi/SSRF), sem patterns estruturais de framework/arquitetura para nenhum dos 4 alvos — todas as ~20 novas regras foram propostas e validadas do zero. Adicionadas a semgrep-rules.yaml: Angular complementar (@NgModule/@Directive/@Pipe/inject()/Signals — validado real em angular-example: 24/27/22/605/519 matches), Spring Boot complementar (@Controller/@Repository/@Entity/@Configuration/@Bean/@Transactional — validado real em springboot-api-web+springboot-api-web: 42/50/11/10/47 matches; @Controller puro sem evidencia real), Spring Reactive/WebFlux (Mono/Flux/WebClient/RouterFunction/R2dbcRepository — validado real em webflux-patterns+spring-mvc-vs-webflux: 73/12/28 matches; RouterFunction/R2dbcRepository sem evidencia real), EJB/Jakarta EE (Stateless/Stateful/Singleton/MessageDriven/EJB/Local/Remote/Schedule/Timeout/TransactionAttribute — SEM projeto real no workspace, validado apenas contra arquivo sintetico de teste). Bug real encontrado e corrigido: @Repository do Spring Data e tipicamente aplicado a interface (extends JpaRepository), nao class (mesma classe de limitacao do Semgrep AST ja documentada para RF-018 item 8) — regra corrigida com pattern-either cobrindo os 3 idiomas reais. code-knowledge-graph.agent.md atualizado com nova secao 'Cobertura de Framework (RF-022)'. Registrado atomicamente (catalog.yaml, este); total_agents permanece 26. | 2026-09-01 (17) — Consolidacao do motor de extracao do agent code-knowledge-graph (v1.2.0 -> v2.0.0) em Semgrep CLI (unico, RF-021/RNF-013), a pedido explicito do usuario apos rejeitar dependency-cruiser ('a lib que voce elencou foi horrivel'). Removidos integralmente os arquivos legados em snippets/code-knowledge-graph/: build-graph.js (regex artesanal original), poc-dependency-cruiser.js, poc-semgrep-rules.yaml, poc-semgrep-rules-cross-repo.yaml, build-cross-repo-graph.py (script POC intermediario) — substituidos por 2 arquivos consolidados: semgrep-rules.yaml (16 regras: import graph TS/Java, framework Angular/Spring, integracao HTTP/evento, sensibilidade de dado via pattern-regex nativo do Semgrep, endpoints REST cross-repo) e build-graph.py (orquestrador unico via subprocess, BFS/DFS/matching 1-para-N em Map/Set). Pesquisa web confirmou que Semgrep OSS/CE nao tem 'join mode' estavel para matching 1-para-N nativo (responsabilidade de pos-processamento). 2 bugs reais encontrados e corrigidos durante consolidacao: (1) Semgrep AST nao reconhece 'interface' TS para pattern de field (so 'class') — corrigido com pattern-regex nativo (funciona para ambos); (2) matching cross-repo 1-para-1 greedy gerava falso-positivo em massa com paths curtos (ex. '/v1' sozinho casava com 39 controllers) — corrigido com guarda de profundidade minima de 2 segmentos de path. Validado em escala real: springboot-api-web (Spring Boot, 1163 arquivos) + angular-example (Angular, 1050 arquivos) = 2213 arquivos, ~4min, 849 nos, 1047 arestas (1017 import, 68 http), 3 ciclos reais detectados, 28 arestas cross-repo (21 exact + 7 heuristic, 0 falso-positivo pos-fix). Agent registrado atomicamente (README.md, este catalog.yaml); nenhuma mudanca em total_agents (26). Documentado em docs/requirements/REQ-grafo-conhecimento-codigo.md §15..§17. | 2026-09-01 (16) — Executado plano de remocao autorizado (docs/requirements/REQ-grafo-conhecimento-codigo.md §13.4, rodada 14): removida a skill dependency-graph-mapping do repositorio apos Gate de Paridade Funcional (RNF-012) validado 9/9 com evidencia de execucao real (§11/§12 do REQ). Atualizados atomicamente: code-knowledge-graph.agent.md (v1.1.0->v1.2.0, ~9 referencias 'nao remover'/'permanece intacta' removidas, RF-017/RF-018/RF-019 agora fonte normativa propria), analysis-architect.agent.md (referencia a dependency-graph-mapping substituida por @code-knowledge-graph), refactor-planner.agent.md (idem), catalog.yaml (related_skills/source_docs/description atualizados nos 3 agents), skills/.index.json (entrada removida), skills/README.md (linha de catalogo removida) e o proprio arquivo .github/skills/dependency-graph-mapping/SKILL.md (removido fisicamente). Nenhuma referencia orfa remanescente em .github/ apos varredura final (R-015/R-040). | 2026-09-01 (15) — Estendido agent code-knowledge-graph (v1.0.0 -> v1.1.0) implementando RF-013..RF-019/RNF-011/RNF-012 (docs/requirements/REQ-grafo-conhecimento-codigo.md §8.3, plano tecnico do analysis-architect rodada 6): agora cobre tambem o nivel arquitetural entre sistemas/servicos — coleta de artefatos de integracao via grep_search/file_search (RF-013), construcao real de nos type:system|service e arestas type:http|queue|event antes apenas reservados no schema (RF-014), blast radius profundidade 1 e 2 via BFS limitado sobre a estrutura Map/Set ja existente sem lib externa (RF-015), deteccao de dependencia circular v