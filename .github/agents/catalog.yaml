version: "1.0"
domain: "governanca-ai-generica"
agents:
  agent-router:
    id: "agent-router"
    priority: 1
    domain: "Orquestracao agent-first"
    description: "Entry point obrigatorio para classificar intencao e delegar para agents downstream"
    keywords:
      - "router"
      - "triagem"
      - "entrypoint"
      - "roteamento"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
    related_agents:
      - "bug-triage"
      - "test-strategy"
      - "refactor-planner"
      - "impact-architect"
      - "docs-curator"
      - "research-router"
      - "analysis-architect"
    related_skills:
      - "context-mode"
      - "tavily"
      - "agent-contracts"
      - "handoff-governance"
      - "confidence-fallback-policy"
      - "agent-observability-otel"
    source_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
      - "docs/ai-context/routing-graph.yaml"
      - "docs/ai-context/evals/casos-roteamento.yaml"
    estimated_time_minutes: 15

  prompt-structuring:
    id: "prompt-structuring"
    priority: 1.5
    version: "1.0.0"
    domain: "Refinamento estrutural de prompt (passo mandatorio)"
    description: >-
      Passo mandatorio pos-agent-router (excecao R-041): refina o prompt recebido
      em loop controlado (maximo 5 iteracoes) no formato canonico
      <task>/<context>/<constraints>/<output_format> e sempre retorna ao
      agent-router antes de qualquer classificacao de intencao/delegacao downstream.
    keywords:
      - "refinar prompt"
      - "estruturar prompt"
      - "prompt loop"
      - "meta-prompting"
      - "clarificacao de prompt"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/agent-router.agent.md"
    related_agents:
      - "agent-router"
    related_skills:
      - "prompt-engineering-patterns"
      - "agent-contracts"
      - "confidence-fallback-policy"
    source_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/prompt-structuring.agent.md"
      - ".github/agents/agent-router.agent.md"
      - ".github/skills/prompt-engineering-patterns/SKILL.md"
      - "docs/ai-context/routing-graph.yaml"
      - "docs/ai-context/evals/casos-roteamento.yaml"
    estimated_time_minutes: 5

