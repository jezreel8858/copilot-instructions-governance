stica de nome de simbolo com flag confidence exact|heuristic, arestas heuristic nunca contam para o calculo de cobertura >=80% (RF-010/RNF-005/§6.2); estrutura de grafo interna via Map/Set em memoria, sem lib externa, tratada como tool interna nunca exposta (RNF-004/§6.5); execucao puramente deterministica, sem invocar LLM em nenhuma etapa (RNF-008 — diferenca arquitetural explicita do code-summarizer, que e hibrido); persistencia exclusiva em cache do context-mode nesta fase, sem arquivo .json/.md versionado (RF-008); respeita R-009 (nunca persiste sem confirmacao no gatilho pos-/add-project-context), R-010 (nunca reproduz segredo) e R-038 (artefato generico). Limitacao conhecida documentada: RNF-006/RNF-007 (limiares de performance/latencia) permanecem NAO IDENTIFICADO no REQ, sem SLA garantido. RF-012/RNF-009 (remocao da skill dependency-graph-mapping) permanecem FORA DE ESCOPO desta criacao, bloqueados ate pesquisa de mercado + validacao de paridade funcional por @analysis-architect — nenhuma referencia a dependency-graph-mapping foi alterada. run_subagent presente no frontmatter (bloqueante R-042); secao Retorno ao Router com gatilho de deriva especifico. Registrado atomicamente em catalog.yaml e README.md (R-015); total_agents 25 -> 26."
