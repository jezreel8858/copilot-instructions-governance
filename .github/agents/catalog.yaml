metadata:
  total_agents: 24
  last_updated: "2026-08-30T20:00:00Z"
  changelog: "2026-08-30 (8) — Visibilidade de Fluxo (R-042): fechado gap de mercado onde apenas o agent-router declarava 'Agente Ativo' na propria resposta, deixando o usuario sem visibilidade quando um agent downstream respondia sozinho por varios turnos em task_mode. Pesquisa Tavily 2026 confirmou o padrao consolidado (LangGraph 'Stream the Active Agent' com campo active_agent streamado; OpenAI Agents SDK HandoffOutputItem imprimindo 'Handed off from X to Y'). Nova secao agent-contracts/SKILL.md § 0 (Banner Universal de Identidade) normatiza que TODO agent -- nao so o agent-router -- abre toda resposta com 'Agente Ativo: <name>', e declara 'Handoff: <origem> -> <destino> (motivo: ...)' quando a resposta e resultado de re-triagem. Propagado via script Node.js para os 23 agents downstream (paragrafo 'Banner obrigatorio' inserido na secao existente 'Retorno ao Router'), para os 2 templates (research-agent.md, operational-agent.md) e para o proprio agent-router.agent.md (novo campo 'Transicao' no Formato de Saida). agent-factory.agent.md passa a validar o banner em Padroes Obrigatorios, Checklist e Formato de Saida. Atualizado CLAUDE.md (R-042), copilot-instructions.md (fluxo garantido), agents/README.md § 8 e handoff-governance/SKILL.md § 5.2. | 2026-08-30 (7) — Fechado gap estrutural de tooling para R-042: run_subagent e obrigatorio e bloqueante no frontmatter tools de TODO agent (sem ele, o handoff de retorno a @agent-router descrito em prosa nao e executavel). Corrigidos 3 agents que nao tinham run_subagent (agent-factory, adapter-generator, binding-initializer). Fechada a causa raiz nos templates usados pelo agent-factory para criar novos agents: templates/research-agent.md (tools corrigidas para nomenclatura canonica + run_subagent + nova secao Retorno ao Router) e templates/operational-agent.md (run_subagent adicionado + nova secao Retorno ao Router, antes ausente). agent-factory.agent.md passou a validar essa regra em Padroes Obrigatorios, Checklist e Formato de Saida. Nova secao agent-contracts/SKILL.md § 9 (Ferramentas Minimas por Agent — Tooling Baseline) com tabela de tools minimas por perfil. Atualizado CLAUDE.md (R-042), copilot-instructions.md e agents/README.md § 8 com o pre-requisito de tooling. | 2026-08-30 (6) — Especialistas angular/spring-boot/spring-reactive migrados de perfil 'advisory puro' para perfil HIBRIDO (v2.0.0): agora tambem implementam feature nova/bugfix dentro do proprio dominio de stack, seguindo padroes de mercado 2026 pesquisados via Tavily (Angular: Signals/RxJS boundary, testing-first, Vitest; Spring Boot: virtual threads vs reativo, N+1/OSIV, DTOs de borda; Spring Reactive: sem bloqueio de event-loop, operadores de erro, StepVerifier/WebTestClient). Testing-first e diff minimo sao obrigatorios em modo Implementacao. Criadas 3 skills novas de implementacao (angular-implementation-patterns, spring-boot-implementation-patterns, spring-reactive-implementation-patterns), complementares as 3 skills de analise ja existentes. tools dos 3 agents expandidas com create_file/insert_edit_into_file/get_errors/run_in_terminal. routing-graph.yaml: tipo de no specialist_advisory -> specialist_hybrid; condicao intent_drift_detected ajustada para nao confundir implementacao dentro do dominio com deriva de intencao (R-042). Registrado em catalog.yaml, routing-graph.yaml, CLAUDE.md (R-042), copilot-instructions.md, agents/README.md, skills/.index.json, skills/README.md e casos-roteamento.yaml (R-015/R-040). | 2026-08-30 (5) — R-042 (Re-triagem Obrigatoria por Turno — Anti Sticky-Session): fechado gap onde agent downstream ativo perdia a inteligencia de roteamento apos o primeiro turno (requisito->implementacao, analise->codigo). Adicionada secao 'Retorno ao Router' em todos os 23 agents downstream/specialist (atualizacao atomica R-015), com gatilho de deriva de intencao especifico por agent. agent-router v1.5.0: Decision Tree com PASSO 0.3 (re-triagem por deriva), output com campo 'Agente Ativo' para auditoria. routing-graph.yaml: aresta reversa universal (de: *downstream -> para: agent-router, condicao intent_drift_detected, prioridade 0) + nos/arestas para os 3 specialists angular/spring-boot/spring-reactive (antes orfaos — nao rotaveis pelo router, so por @mencao manual). handoff-governance/SKILL.md § 5/5.2 atualizado. Evals: canon-015/016/017 (specialists rotaveis) + regr-014/015 (sticky-session). Pesquisa de mercado: OpenAI Agents SDK handoffs (transfer_back_to_supervisor), LangGraph supervisor pattern (add_handoff_back_messages), state machine de 2 modos (orchestrator_mode/task_mode) com deteccao conservadora de off-topic. | 2026-08-29 (4) — Criado agent requirements-analyst (perfil Operacional, prospectivo): elicita e estrutura requisitos funcionais/nao-funcionais a partir de pedido de negocio ambiguo, aplicando ISO/IEC/IEEE 29148, notacao EARS, INVEST, Gherkin/BDD e FURPS+; detecta solution-jumping via tecnica Five Whys; nunca decide arquitetura (handoff para impact-architect/analysis-architect/refactor-planner); nunca extrai regra de codigo existente (nao confundir com business-rules-extractor, que e reverso). Skill requirements-engineering-patterns criada (pesquisa de mercado). Registrado em catalog.yaml, README.md, routing-graph.yaml, casos-roteamento.yaml e skills/.index.json (R-015/R-040)."

