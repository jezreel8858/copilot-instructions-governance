version: "1.0"
domain: "governanca-ai-generica"
agents:
  agent-router:
    id: "agent-router"
    model: "Claude Sonnet 5"
    priority: 1
    domain: "Orquestracao agent-first"
    description: "Entry point obrigatorio para classificar intencao e delegar para agents downstream"
    keywords:
      - "router"
      - "triagem"
      - "entrypoint"
      - "roteamento"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
    related_agents:
      - "bug-triage"
      - "test-strategy"
      - "refactor-planner"
      - "deep-search"
      - "docs-curator"
      - "analysis-architect"
    related_skills:
      - "context-mode"
      - "tavily"
      - "agent-contracts"
      - "handoff-governance"
      - "confidence-fallback-policy"
      - "agent-observability-otel"
    source_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
      - "docs/ai-context/routing-graph.yaml"
      - "docs/ai-context/evals/casos-roteamento.yaml"
    estimated_time_minutes: 15

  prompt-structuring:
    id: "prompt-structuring"
    model: "Claude Haiku 4.5"
    priority: 1.5
    version: "1.0.0"
    domain: "Refinamento estrutural de prompt (passo mandatorio)"
    description: >-
      Passo mandatorio pos-agent-router (excecao R-041): refina o prompt recebido
      em loop controlado (maximo 5 iteracoes) no formato canonico
      <task>/<context>/<constraints>/<output_format> e sempre retorna ao
      agent-router antes de qualquer classificacao de intencao/delegacao downstream.
    keywords:
      - "refinar prompt"
      - "estruturar prompt"
      - "prompt loop"
      - "meta-prompting"
      - "clarificacao de prompt"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/agent-router.agent.md"
    related_agents:
      - "agent-router"
    related_skills:
      - "prompt-engineering-patterns"
      - "agent-contracts"
      - "confidence-fallback-policy"
    source_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/prompt-structuring.agent.md"
      - ".github/agents/agent-router.agent.md"
      - ".github/skills/prompt-engineering-patterns/SKILL.md"
      - "docs/ai-context/routing-graph.yaml"
      - "docs/ai-context/evals/casos-roteamento.yaml"
    estimated_time_minutes: 5

  bug-triage:
    id: "bug-triage"
    model: "Claude Sonnet 5"
    priority: 2
    domain: "Triagem de bugs e regressao"
    description: "Classificar bugs, reproduzir erro e propor plano minimo de correcao"
    keywords:
      - "bug"
      - "regressao"
      - "erro"
      - "severidade"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
    related_agents:
      - "agent-router"
      - "analysis-architect"
      - "test-implementation"
    related_skills:
      - "context-mode"
      - "terminal-governance"
      - "code-tracing"
      - "agent-contracts"
      - "confidence-fallback-policy"
      - "agent-evals-lab"
    source_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/bug-triage.agent.md"
      - ".github/skills/terminal-governance/SKILL.md"
      - ".github/skills/code-tracing/SKILL.md"
    estimated_time_minutes: 25

  test-strategy:
    id: "test-strategy"
    model: "Claude Sonnet 5"
    priority: 3
    domain: "Estrategia de testes"
    description: "Planejar cobertura, cenarios e criterios de aceitacao por risco"
    keywords:
      - "testes"
      - "cobertura"
      - "criterios"
      - "estrategia"
    prerequisite_docs:
